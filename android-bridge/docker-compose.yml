version: '3.8'
services:
  redroid:
    image: redroid/redroid:11.0.0-latest
    privileged: true
    volumes:
      - ./data:/data
    ports:
      - "5555:5555"
    command:
      - "androidboot.redroid_width=1080"
      - "androidboot.redroid_height=1920"
      - "androidboot.redroid_dpi=480"
      - "androidboot.hardware.hwcomposer=redroid"
      
  bridge-worker:
    build: .
    depends_on:
      - redroid
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDROID_HOST=redroid:5555
    restart: always
